[project]
name = "intuition-memory"
version = "0.1.2"
description = "Intuition — a daily-driver agent memory: Markdown in git, FTS5 search, one Steward that writes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hermes = []          # hermes_agent is provided by the host install
test = ["pytest"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/Shixuuu/intuition"
Repository = "https://github.com/Shixuuu/intuition"
Issues = "https://github.com/Shixuuu/intuition/issues"

[project.scripts]
intuition = "intuition.cli:main"

[project.entry-points."hermes_agent.memory_providers"]
intuition = "intuition.adapters.hermes:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intuition"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]

