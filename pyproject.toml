[project]
name = "intuition"
version = "0.1.0"
description = "Intuition — a daily-driver agent memory: Markdown in git, FTS5 search, one Steward that writes."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hermes = []          # hermes_agent is provided by the host install
test = ["pytest"]

[project.scripts]
intuition = "intuition.cli:main"

[project.entry-points."hermes_agent.memory_providers"]
intuition = "intuition.adapters.hermes:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intuition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
