name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test suite (includes the retrieval eval gate)
        run: python -m pytest tests -q
      - name: Retrieval eval gate against a fresh store
        run: |
          intuition init "$RUNNER_TEMP/memory"
          intuition --store "$RUNNER_TEMP/memory" eval evals/retrieval.toml
